name: register-lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  register-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint REQUIREMENTS.md register structure
        run: python3 scripts/register_lint.py
