name: version-guard

# Any change under plugins/<name>/ must bump that plugin's plugins/<name>/.claude-plugin/plugin.json.
# An unbumped change lands on GitHub but never reaches installed clients:
# the client Update path compares versions, and an equal version reads as
# "no update". Ported from process-design-plugin's plugin-ci version-guard
# job. Fleet rollout source: Linglepedia
# _claude_config/loop-closure/RCA-2026-08-22-version-increments-missed.md.

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed content must bump the plugin version
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          if [ "$EVENT" = "pull_request" ]; then
            BASE_SHA="$PR_BASE"
          else
            BASE_SHA="$PUSH_BASE"
            case "$BASE_SHA" in
              ""|0000000000000000000000000000000000000000)
                echo "no base to diff against (new branch); skipping"; exit 0;;
            esac
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || {
              echo "base $BASE_SHA not in history (force push?); skipping"; exit 0; }
          fi
          fail=0
          checked=0
          for dir in plugins/*/; do
            name=$(basename "$dir")
            if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$dir"; then
              checked=1
              old=$(git show "$BASE_SHA:${dir}.claude-plugin/plugin.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
              new=$(git show "$HEAD_SHA:${dir}.claude-plugin/plugin.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
              if [ -z "$old" ]; then
                echo "OK $name: new plugin at version ${new:-<none>}"
              elif [ -z "$new" ]; then
                echo "OK $name: plugin removed"
              elif [ "$old" = "$new" ]; then
                echo "FAIL $name: content changed but version is still $old — bump plugins/$name/.claude-plugin/plugin.json"
                fail=1
              elif [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -n1)" != "$new" ]; then
                echo "FAIL $name: version went backwards ($old -> $new) — clients on $old would never see this update"
                fail=1
              else
                echo "OK $name: $old -> $new"
              fi
            fi
          done
          [ "$checked" = 0 ] && echo "no plugin content changed"
          exit $fail
